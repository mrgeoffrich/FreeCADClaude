<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + user-scalable=no are load-bearing for the canvas: the
     app is full-bleed on a tablet, and the browser's own double-tap/pinch zoom
     would fight the pen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>FreeCAD annotation</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<!-- The shell is static markup, not built by TypeScript: five buttons and a
     canvas are cheaper to read (and to compare against the mockup) as HTML.
     src/ui.ts owns everything that happens to it. -->
<div class="app">

  <div class="statusbar">
    <span class="dot off" id="dot"></span>
    <span class="title" id="docname">No image</span>
    <span class="sep">·</span>
    <span class="subtitle" id="viewname">pick a source to start</span>
    <span class="badge" id="conf">no scale</span>
    <!-- Phase 5 fills this in from the capture's mm/px. -->
    <span class="scale" id="scaletext"></span>
  </div>

  <div class="work">
    <!-- left-edge toolbar: the pen hand rests on the right, so controls sit
         where they won't be covered while drawing -->
    <div class="toolbar">
      <button class="tool" id="t-source" title="Image source" aria-label="Image source">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16.5l4.8-4.2a2 2 0 0 1 2.6 0L21 20"/></svg>
      </button>
      <div class="rule"></div>
      <button class="tool" id="t-pen" aria-pressed="true" title="Pen" aria-label="Pen">
        <svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L8 20H4v-4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <!-- Dimensions are phase 5; the button is kept as a disabled placeholder
           so the toolbar's layout and tap targets are the real ones. -->
      <button class="tool" id="t-dim" aria-pressed="false" title="Dimension — not yet" aria-label="Dimension" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 8v8M20 8v8M4 12h16"/><path d="M7 10l-3 2 3 2M17 10l3 2-3 2"/></svg>
      </button>
      <div class="rule"></div>
      <button class="tool" id="t-undo" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="tool" id="t-clear" title="Clear" aria-label="Clear">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
      </button>
      <div class="spacer"></div>
    </div>

    <div class="canvaswrap" id="canvaswrap">
      <canvas id="sheet"></canvas>

      <div class="hint" id="hint">Pen draws · touch is ignored while a stylus is in use</div>

      <div class="banner" id="banner" hidden>
        <span id="banner-text"></span>
        <button id="banner-load" type="button">Load</button>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>

  <div class="sendbar">
    <input id="caption" placeholder="Say what you want done (optional)">
    <button class="send" id="send" type="button">Send</button>
  </div>

  <!-- ── image source sheet ── -->
  <div class="scrim" id="sheet-sources" hidden>
    <div class="sheet">
      <h2>Image source</h2>
      <p>What do you want to mark up?</p>
      <!-- Phase 4 enables this and points it at GET /api/latest. -->
      <button class="choice" id="src-freecad" type="button" disabled>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 16.5l4.8-4.2a2 2 0 0 1 2.6 0L21 18"/><circle cx="8.5" cy="9" r="1.5"/></svg>
        <span>Latest view from FreeCAD<small id="src-freecad-sub">Not available yet</small></span>
      </button>
      <button class="choice" id="src-camera" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l1.5-2h5L16 6"/></svg>
        <span>Take a photo<small>Opens the camera</small></span>
      </button>
      <button class="choice" id="src-library" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg>
        <span>Choose from device<small>Photos or files — a sketch, a reference, a drawing</small></span>
      </button>
      <div class="row" style="justify-content:flex-end;margin-top:4px">
        <button class="btn ghost" id="src-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

</div>

<!-- Two inputs, not one: `capture="environment"` is what opens the camera app
     directly (getUserMedia needs a secure context and this is plain HTTP), but
     it also *prevents* picking an existing file, so the library needs its own. -->
<input type="file" id="file-library" accept="image/*" hidden>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
